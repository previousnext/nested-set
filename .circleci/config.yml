version: 2.1

executors:
  php84:
    docker:
      - image: skpr/php-cli:8.4-v2-stable
  php85:
    docker:
      - image: skpr/php-cli:8.5-v2-stable

workflows:
  build:
    jobs:
      - build:
          matrix:
            parameters:
              php: ["php84", "php85"]
              composer-opts: ["", "--prefer-lowest"]

jobs:
  build:
    parameters:
      php:
        type: executor
      composer-opts:
        type: string
    executor: << parameters.php >>
    working_directory: /data
    steps:
      - checkout
      - run: composer update --prefer-dist --no-progress --no-suggest --no-interaction --optimize-autoloader << parameters.composer-opts >>
      - run: ./bin/phpcs --colors --report=full --runtime-set testVersion 8.0-
      - run: php -d memory_limit=-1 ./bin/phpstan analyze --no-progress
      - run: mkdir -p build/phpunit
      - run: ./bin/phpunit --log-junit build/phpunit/results.xml
      - store_test_results:
          path: build
